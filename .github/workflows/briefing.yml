name: briefing
on:
  schedule:
    - cron: "*/30 19-23,0-2 * * *"  # UTC = 韩国时间 04:00–11:30, 每 30 分钟排一次队, 脚本里判断是否到点
  workflow_dispatch:
    inputs:
      force:
        description: 跳过时间/已发检查, 立刻发送
        type: boolean
        default: false
permissions:
  contents: write  # 把 state.json(已发记录)提交回仓库
concurrency: briefing
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python briefing.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FORCE: ${{ inputs.force && '1' || '' }}
      - run: |
          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
